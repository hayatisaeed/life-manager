name: Nightly convergence simulator

# Long run of the multi-device convergence simulator (RELEASE.md §4,
# ROADMAP P0.6 AC: 1,000 seeds × 1,000 ops × 5 devices).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds per shard
        default: '125'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Simulate
        env:
          SIM_SEEDS: ${{ github.event.inputs.seeds || '125' }}
          SIM_OPS: '1000'
          SIM_SEED_START: ${{ matrix.shard * 125 + 1 }}
        run: pnpm --filter @lm/sync exec vitest run test/convergence.test.ts
